<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add / Edit Product</title>
    <link rel="stylesheet" href="css/site.css">
</head>
<body>
    <header class="app-header compact-header">
        <div>
            <p class="eyebrow">Product Form</p>
            <h1 id="pageTitle">Add Product</h1>
            <p class="subtitle">Fill the form below. Client-side validation runs before sending data to the API.</p>
        </div>
        <a class="secondary-button" href="index.html">Back to List</a>
    </header>

    <main class="container narrow">
        <section class="card form-card">
            <div id="message" class="message hidden"></div>

            <form id="productForm" novalidate>
                <div class="form-group">
                    <label for="name">Product Name <span>*</span></label>
                    <input type="text" id="name" name="name" maxlength="100" placeholder="Example: Wireless Mouse">
                    <small class="error" id="nameError"></small>
                </div>

                <div class="form-group">
                    <label for="category">Category <span>*</span></label>
                    <input type="text" id="category" name="category" maxlength="60" placeholder="Example: Electronics">
                    <small class="error" id="categoryError"></small>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="price">Price <span>*</span></label>
                        <input type="number" id="price" name="price" min="0.01" step="0.01" placeholder="0.00">
                        <small class="error" id="priceError"></small>
                    </div>

                    <div class="form-group">
                        <label for="quantity">Quantity <span>*</span></label>
                        <input type="number" id="quantity" name="quantity" min="0" step="1" placeholder="0">
                        <small class="error" id="quantityError"></small>
                    </div>
                </div>

                <div class="form-group">
                    <label for="supplier">Supplier</label>
                    <input type="text" id="supplier" name="supplier" maxlength="100" placeholder="Example: ABC Traders">
                    <small class="error" id="supplierError"></small>
                </div>

                <div class="form-actions">
                    <button type="submit" class="primary-button" id="submitButton">Save Product</button>
                    <a href="index.html" class="secondary-button">Cancel</a>
                </div>
            </form>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/product-form.js"></script>
</body>
</html>
